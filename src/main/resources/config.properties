# 服务端口
server.port=9090
# 监听地址；生产环境建议由反向代理暴露，应用本身可绑定 127.0.0.1
server.bind.host=0.0.0.0
# 【必须修改】鉴权 Token，你的业务系统发起请求时必须携带此 Token (用于调用 WCPW)
wcpw.request_token=wcpw-request-token
# 【必填】回调签名密钥 (用于 WCPW 回调你的系统)
# 必须与你的业务系统 (如 NeoAuthServer) 中的验签密钥一致
wcpw.callback_secret=wcpw-callback-secret
# 订单超时时间 (秒)
order.timeout.seconds=120
order.timeout.max.seconds=900
# 单次请求体上限，防止无界 readAllBytes 导致内存耗尽
request.max.body.bytes=65536
# 单笔订单金额上限
order.max.amount=1000000
# 回调发送总次数上限（允许 1-3；次数会持久化，三次耗尽后不再自动发送）
callback.retry.count=3
# 两次回调请求之间的等待时间（毫秒）
callback.retry.interval.ms=2000
callback.queue.max.record.bytes=1048576
# callbackUrl 仍由已认证调用方指定；此项只限制协议类型和输入长度
callback.allowed.schemes=http,https
callback.url.max.length=2048
# 保持现有回调协议兼容；新部署可改为 HMAC-SHA256
callback.signature.algorithm=MD5
# SSL 配置 (推荐开启 HTTPS 以防止中间人攻击)
ssl.cert.path=
ssl.key.path=
